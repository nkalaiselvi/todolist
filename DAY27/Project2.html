<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 24px;
      color: #1f2937;
    }
    h1 {
      text-align: center;
      color: #7c3aed;
    }
    .post-list {
      max-width: 900px;
      margin: auto;
      display: grid;
      gap: 14px;
    }
    .post-card {
      background: white;
      padding: 16px 18px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .post-card h3 {
      margin: 0 0 8px;
      color: #111827;
    }
    .post-card p {
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Blog Post Viewer</h1>
  <div id="postList" class="post-list"></div>

  <script>
    async function loadPosts() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts');
        if (!response.ok) throw new Error('Failed to fetch posts');

        const posts = await response.json();
        const postList = document.getElementById('postList');

        postList.innerHTML = posts.map(post => `
          <div class="post-card">
            <h3>${post.title}</h3>
            <p>${post.body}</p>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('postList').innerHTML = `<p>${error.message}</p>`;
      }
    }

    loadPosts();
  </script>
</body>
</html>
