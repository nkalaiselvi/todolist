<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users API Display</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 24px;
      color: #222;
    }
    h1 {
      text-align: center;
      color: #1d4ed8;
    }
    .user-list {
      max-width: 800px;
      margin: auto;
      display: grid;
      gap: 12px;
    }
    .user-card {
      background: white;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .user-card h3 {
      margin: 0 0 8px;
    }
    .user-card p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <h1>Users API</h1>
  <div id="usersList" class="user-list"></div>

  <script>
    async function loadUsers() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!response.ok) throw new Error('Failed to fetch users');

        const users = await response.json();
        const usersList = document.getElementById('usersList');

        usersList.innerHTML = users.map(user => `
          <div class="user-card">
            <h3>${user.name}</h3>
            <p><strong>Phone:</strong> ${user.phone}</p>
            <p><strong>Email:</strong> ${user.email}</p>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('usersList').innerHTML = `<p>${error.message}</p>`;
      }
    }

    loadUsers();
  </script>
</body>
</html>
