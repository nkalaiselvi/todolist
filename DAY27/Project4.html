<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      margin: 0;
      padding: 24px;
      color: #0f172a;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2563eb;
      margin-bottom: 16px;
    }
    input, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-right: 8px;
      margin-bottom: 12px;
    }
    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      border: none;
    }
    .weather-card {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: #eff6ff;
    }
    .weather-card h2 {
      margin-top: 0;
    }
    .weather-card p {
      font-size: 16px;
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Weather Dashboard</h1>
    <input id="cityInput" type="text" placeholder="Enter city name" />
    <button onclick="getWeather()">Get Weather</button>
    <div id="weatherOutput"></div>
  </div>

  <script>
    // Map Open-Meteo weather codes to readable conditions
    const weatherCodeMap = {
      0: 'Clear',
      1: 'Mainly clear',
      2: 'Partly cloudy',
      3: 'Overcast',
      45: 'Fog',
      48: 'Depositing rime fog',
      51: 'Light drizzle',
      53: 'Moderate drizzle',
      55: 'Dense drizzle',
      56: 'Freezing drizzle',
      57: 'Dense freezing drizzle',
      61: 'Slight rain',
      63: 'Moderate rain',
      65: 'Heavy rain',
      66: 'Freezing rain',
      67: 'Heavy freezing rain',
      71: 'Slight snow fall',
      73: 'Moderate snow fall',
      75: 'Heavy snow fall',
      77: 'Snow grains',
      80: 'Slight rain showers',
      81: 'Moderate rain showers',
      82: 'Violent rain showers',
      85: 'Slight snow showers',
      86: 'Heavy snow showers',
      95: 'Thunderstorm',
      96: 'Thunderstorm with slight hail',
      99: 'Thunderstorm with heavy hail'
    };

    async function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      const output = document.getElementById('weatherOutput');

      if (!city) {
        output.innerHTML = '<p>Please enter a city name.</p>';
        return;
      }

      output.innerHTML = '<p>Loading...</p>';

      try {
        // 1) Geocode the city name (open, no API key)
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
        if (!geoRes.ok) throw new Error('Geocoding request failed');
        const geoData = await geoRes.json();
        if (!geoData.results || geoData.results.length === 0) {
          throw new Error('City not found');
        }

        const place = geoData.results[0];
        const lat = place.latitude;
        const lon = place.longitude;
        const displayName = `${place.name}${place.country ? ', ' + place.country : ''}`;

        // 2) Fetch weather (current + hourly humidity)
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m&timezone=auto`;
        const weatherRes = await fetch(weatherUrl);
        if (!weatherRes.ok) throw new Error('Weather request failed');
        const weather = await weatherRes.json();

        const current = weather.current_weather || null;
        let humidity = 'N/A';

        if (weather.hourly && weather.hourly.time && weather.hourly.relativehumidity_2m && current && current.time) {
          const times = weather.hourly.time.map(t => new Date(t).getTime());
          const hums = weather.hourly.relativehumidity_2m;
          const currentTs = new Date(current.time).getTime();
          // find the nearest hourly timestamp to current time
          let bestIdx = -1;
          let bestDiff = Infinity;
          for (let i = 0; i < times.length; i++) {
            const diff = Math.abs(times[i] - currentTs);
            if (diff < bestDiff) {
              bestDiff = diff;
              bestIdx = i;
            }
          }
          if (bestIdx !== -1 && typeof hums[bestIdx] !== 'undefined') {
            humidity = hums[bestIdx] + '%';
          }
        }

        const condition = current && typeof current.weathercode !== 'undefined'
          ? (weatherCodeMap[current.weathercode] || `Code ${current.weathercode}`)
          : 'Unknown';

        output.innerHTML = `
          <div class="weather-card">
            <h2>${displayName}</h2>
            <p><strong>Temperature:</strong> ${current ? current.temperature + '°C' : 'N/A'}</p>
            <p><strong>Humidity:</strong> ${humidity}</p>
            <p><strong>Condition:</strong> ${condition}</p>
          </div>
        `;
      } catch (error) {
        output.innerHTML = `<p>${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
